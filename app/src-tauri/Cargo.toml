[package]
name = "daydream"
version = "1.4.0"
license = "GPL-3.0-or-later"
description = "Daydream music player"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# Smallest practical binary: optimize for size, link-time optimize, strip symbols.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
